<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadpool 2?</title>
<style>
:root{--bg:#1a0b0d;--fg:#fff4f0;--red:#d6102a;--red2:#8f0a1c;--mute:#2a1417;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#1a0b0d;--fg:#fff4f0}}
:root[data-theme="dark"]{--bg:#1a0b0d;--fg:#fff4f0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Impact,"Arial Black",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{max-width:420px;width:100%}
#dp{width:150px;height:150px;display:block;margin:0 auto 20px}
#dp .m{display:none}
#dp[data-mood="neutral"] .neutral,#dp[data-mood="happy"] .happy,#dp[data-mood="sad"] .sad{display:inline}
#dp.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#dp.pop{animation:none}}
h1{font-size:2rem;line-height:1.15;margin:0 0 12px;letter-spacing:.5px}
#msg{min-height:1.6em;margin:0 0 24px;font-family:system-ui,sans-serif;font-size:1.1rem;opacity:.85}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:56px}
button{font:inherit;font-size:1.3rem;padding:14px 36px;border:0;border-radius:12px;cursor:pointer;color:#fff}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#si{background:var(--red)}
#no{background:var(--mute);border:2px solid var(--red2)}
#si:active,#no:active{transform:scale(.96)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <svg id="dp" data-mood="neutral" viewBox="0 0 200 200" aria-hidden="true">
    <ellipse cx="100" cy="102" rx="80" ry="88" fill="#c8102e" stroke="#7d0a1c" stroke-width="5"/>
    <path d="M100 16 L100 58" stroke="#9b0c23" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M40 60 Q60 40 78 36 M160 60 Q140 40 122 36" stroke="#9b0c23" stroke-width="3" stroke-linecap="round" fill="none"/>

    <g class="m neutral">
      <g transform="translate(66,92) rotate(22)"><ellipse rx="32" ry="20" fill="#111"/><ellipse rx="18" ry="9" fill="#fff"/></g>
      <g transform="translate(134,92) rotate(-22)"><ellipse rx="32" ry="20" fill="#111"/><ellipse rx="18" ry="9" fill="#fff"/></g>
      <path d="M82 152 Q100 156 118 152" stroke="#3a0008" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <g class="m happy">
      <g transform="translate(66,90) rotate(-8)"><ellipse rx="32" ry="20" fill="#111"/><path d="M-17 7 Q0 -15 17 7 Q0 -3 -17 7Z" fill="#fff"/></g>
      <g transform="translate(134,90) rotate(8)"><ellipse rx="32" ry="20" fill="#111"/><path d="M-17 7 Q0 -15 17 7 Q0 -3 -17 7Z" fill="#fff"/></g>
      <path d="M68 138 Q100 184 132 138 Z" fill="#5a0010" stroke="#3a0008" stroke-width="4" stroke-linejoin="round"/>
      <path d="M78 140 Q100 150 122 140 L122 143 Q100 153 78 143Z" fill="#fff"/>
    </g>

    <g class="m sad">
      <g transform="translate(66,94) rotate(-22)"><ellipse rx="32" ry="20" fill="#111"/><ellipse rx="17" ry="10" fill="#fff"/></g>
      <g transform="translate(134,94) rotate(22)"><ellipse rx="32" ry="20" fill="#111"/><ellipse rx="17" ry="10" fill="#fff"/></g>
      <path d="M50 120 Q44 134 50 140 Q58 134 50 120Z" fill="#6ec3ff"/>
      <path d="M76 160 Q100 138 124 160" stroke="#3a0008" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </svg>

  <h1 id="q">Sabato a casetta di Diego guardiamo Deadpool 2?</h1>
  <p id="msg"></p>
  <div class="btns">
    <button id="si">Sì</button>
    <button id="no">No</button>
  </div>
</main>
<script>
var clicks = 0;
var si = document.getElementById('si');
var no = document.getElementById('no');
var msg = document.getElementById('msg');
var q = document.getElementById('q');
var dp = document.getElementById('dp');

function setMood(m) {
  dp.setAttribute('data-mood', m);
  dp.classList.remove('pop');
  void dp.getBoundingClientRect();
  dp.classList.add('pop');
}

no.addEventListener('click', function () {
  clicks++;
  setMood('sad');
  if (clicks === 1) {
    no.textContent = 'Sicuri?';
    msg.textContent = 'Sicuri sicuri?';
  } else {
    no.classList.add('hide');
    msg.textContent = 'Eh, ormai non avete scelta 😏';
  }
});

si.addEventListener('click', function () {
  setMood('happy');
  q.textContent = 'Perfetto! Sabato da Diego si guarda Deadpool 2 🍿';
  msg.textContent = '';
  document.querySelector('.btns').classList.add('hide');
});
</script>
</body>
</html>
